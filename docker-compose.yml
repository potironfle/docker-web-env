version: '3.8'

services:

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./html:/usr/share/nginx/html
    networks:
      - web-network
    depends_on:
      - php
      - mariadb

  php:
    build:
      context: .
      dockerfile: Dockerfile-php
    volumes:
      - ./html:/var/www/html
    networks:
      - web-network
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: monsite
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - web-network

networks:
  web-network:
    driver: bridge

volumes:
  db-data:
